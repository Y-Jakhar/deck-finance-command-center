[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These imports deliberately follow environment/path and namespace setup.
"researchdesk.py" = ["E402"]
"tests/test_integration.py" = ["E402"]
